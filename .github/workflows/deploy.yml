name: Generate courses

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 * *'

concurrency: generate-courses

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm
      - name: Generate courses
        # env:
        #   PROXY_SERVER_URL: ${{ secrets.PROXY_SERVER_URL }}
        run: |
          PROXY_ARG=""
          if [ -n "$PROXY_SERVER_URL" ]; then
            PROXY_SERVER=$(curl -sf "$PROXY_SERVER_URL")
            echo "::add-mask::$PROXY_SERVER"
            PROXY_ARG="--proxy-server=$PROXY_SERVER"
          fi
          # Ensure the data directory exists in the deployment branch
          mkdir -p ./gh-pages/data
          # Remove the stray Python bytecode cache inherited from the main branch
          rm -rf ./gh-pages/__pycache__
          # Remove the stale root-level data left by the old layout. The site reads
          # only from data/, and these root copies stopped updating in July.
          rm -f ./gh-pages/courses_*.json ./gh-pages/courses_*.min.js ./gh-pages/last_semesters.json
          # Copy the latest UI files from main branch to the deployment branch
          cp ./main/index.html ./gh-pages/
          cp ./main/app.js ./gh-pages/
          cp ./main/style.css ./gh-pages/
          # Scrape only the most recent year (3 terms). Older semesters already in
          # gh-pages/data are left untouched, and last_semesters.json merges rather
          # than overwrites, so historical data is preserved.
          python -u ./main/courses_to_json.py last-3 \
            './gh-pages/data/courses_{year}_{semester}.json' \
            --min-js-output-file='./gh-pages/data/courses_{year}_{semester}.min.js' \
            --last-semesters-output-file './gh-pages/data/last_semesters.json' \
            --run-postprocessing \
            $PROXY_ARG
      - name: Deploy
        run: |
          cd gh-pages
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet --cached HEAD || git commit -m "Update courses"
          git push
